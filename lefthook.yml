# 提交和推送前的检查（规格-提交前检查，ADR-179；规格-检查统一入口）。按改了哪些文件挑检查；红了改代码或补基线，不用 --no-verify 绕过。
# 装钩子：bun install 时自动装（postinstall），也可以 bunx lefthook install；worktree 共用主仓库的 .git/hooks，装一次就行
# pre-commit、commit-msg 各只有一项，都交给 sumika-dev：挑哪些检查（glob 表）、并行、汇总退出码都在 native/internal/devtools/hook，不在这个文件里。
glob_matcher: doublestar
min_version: 2.2.2

pre-commit:
  commands:
    检查:
      # 读暂存区的版本：别的会话改了一半、没暂存的文件不拦这次提交（2026-10-26）。
      # 程序不在或是 0 字节（-s：0 字节的文件会被 sh 当空脚本执行、退出 0，钩子就静默放行了）先 go build 一次；
      # 先编到 sumika-dev.exe.new.$$ 再 mv 成正式名，编到一半被打断不会留下半截程序。mv 失败但正式文件已经在了（别的进程先换上了），就删掉自己的临时文件、用现成的。
      # 现在整个钩子只有这一个进程会编，之前十来项并行、六项各自现编抢着换同一个 exe（报“文件正被占用”，2026-11-19 两次）的撞车没有了。
      # 这里编出来的程序摘要是空的：shell 里算不出摘要（Go 版本、GOWORK 等一起进哈希），第一次运行由程序自己带摘要重编一次（编译缓存命中，只重新链接）。
      # 已经在的由程序自己核对源码摘要、改过就重编（规格-脚本迁Go「落点」）。
      # env -u：钩子里不认这几个会跳过检查或改指仓库的变量（SUMIKA_DEV_NO_REBUILD 不重编、SUMIKA_DEV_REEXEC_DONE 防重编循环、SUMIKA_DEV_ROOT 改指别的树、
      # SUMIKA_SCAN_DATA 能把隐私扫描的名单改指到别的目录、SUMIKA_SCAN_MAIBOT 把 MaiBot 那份名单改指别处，后两个只给测试用，带进钩子会少读真实名单）。
      # 用 && 连：编不过就红，不放行。写成一行、命令本身不含 shell 引号（Windows 上 lefthook 会拆坏 shell 引号；外面这层是 YAML 的引号）
      run: "{ [ -s native/bin/sumika-dev.exe ] || { (cd native && go build -o bin/sumika-dev.exe.new.$$ ./cmd/sumika-dev) && { mv native/bin/sumika-dev.exe.new.$$ native/bin/sumika-dev.exe 2>/dev/null || { rm -f native/bin/sumika-dev.exe.new.$$; [ -s native/bin/sumika-dev.exe ]; }; }; }; } && env -u SUMIKA_DEV_NO_REBUILD -u SUMIKA_DEV_REEXEC_DONE -u SUMIKA_DEV_ROOT -u SUMIKA_SCAN_DATA -u SUMIKA_SCAN_MAIBOT native/bin/sumika-dev.exe hook pre-commit"

commit-msg:
  commands:
    提交说明:
      # 标题 40 个字以内、不带分号（上级 AGENTS「提交」第 1 条；主人 2026-10-27 嫌提交说明太长）
      # 程序的编法和调用写法同上。{1} 是 git 给的说明文件路径，lefthook 不加引号拼进 sh：反斜杠路径会被吃掉，程序自己认得这种路径、改去问 git 说明文件在哪（找不到就按失败处理，不放行）
      run: "{ [ -s native/bin/sumika-dev.exe ] || { (cd native && go build -o bin/sumika-dev.exe.new.$$ ./cmd/sumika-dev) && { mv native/bin/sumika-dev.exe.new.$$ native/bin/sumika-dev.exe 2>/dev/null || { rm -f native/bin/sumika-dev.exe.new.$$; [ -s native/bin/sumika-dev.exe ]; }; }; }; } && env -u SUMIKA_DEV_NO_REBUILD -u SUMIKA_DEV_REEXEC_DONE -u SUMIKA_DEV_ROOT native/bin/sumika-dev.exe hook commit-msg {1}"

pre-push:
  commands:
    推送前:
      use_stdin: true
      run: bun scripts/pre-push.ts {1} {2}
