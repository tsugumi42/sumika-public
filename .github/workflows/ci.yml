# 公开仓库的 CI（第一版）：Linux 和 Windows 各跑一遍 go vet、go test -short、检查脚本的 bun 测试，Linux 再跑一次文档检查。
#
# 为什么两个系统：主开发机是 Windows，本机合并队列测的是 Windows；Linux 换一个系统和调度跑同一套 Go 测试，
# 抓平台分支、路径大小写、换行这类只在一边出现的问题（.github/workflows/race.yml 只管 -race 的几组契约测试，和这里不重叠）。
#
# 和本机合并队列的关系：现在合 main 前跑的是本机 scripts/go-verify.ts 挑出来的受影响包；以后（ADR-386）合并队列改为等
# 这个工作流在 PR 上的结论，本机只留一条兜底。工作流里不经过 scripts/slot.ts / scripts/run-low.ps1——那是本机的名额和
# 低优先级机制，CI 机器独占整台 runner，直接用普通的 go / bun 命令。
#
# 第一版先全量跑，不写 -skip 名单：已知在某个系统上会红的测试（缺字体、Windows 专用）由第一次真实运行暴露，再单独处理。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同一个 ref 上新的提交取消还在跑的旧运行（官方推荐写法，docs.github.com 的 concurrency 一节）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout；setup-go 官方建议的最小权限

jobs:
  test:
    # 只在公开仓库跑：公开仓库的 Actions 不计分钟，私有仓库按免费额度扣（Windows 按 2 倍）、推 main 时两边各跑一遍是重复（2026-11-18 免费 2000 分钟快用完）
    if: github.event.repository.private == false
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux 这一格先只当参考、红了不挡（2026-11-18）：产品现在只支持 Windows，第四轮 Linux 红了二十多个包，
    # 大多是命名管道、进程、字体、路径这类 Windows 专用的测试，清单在主工作区 data/dev/ci/linux-fail-20261118.txt，
    # 归类修完（Windows 专用的加构建标签，真问题修掉）再去掉这一行。待办第八节有条目。
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false # 一个系统红了，另一个照跑完，一次看到两边结果
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # 各 action 固定到当前官方文档推荐的大版本：checkout v7、setup-go v7、setup-bun v2
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod # 和 native/go.mod 的 go 指令走，不另写一份版本号
          cache-dependency-path: native/go.sum # 模块缓存按 go.sum 的哈希存

      # 版本和本机 `bun --version`（1.4.4）一致；package.json 没有 packageManager 字段，不显式给会用 latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # 根目录依赖（scripts/ 用的）；--frozen-lockfile 保证按 bun.lock 装，lock 和 package.json 对不上就红
      - name: 安装 Bun 依赖
        run: bun install --frozen-lockfile

      # 只在 Linux 跑一次：不依赖系统，Win 上再跑一遍只是多花时间
      - name: 文档检查
        if: runner.os == 'Linux'
        # “ADR 日期不晚于今天”按本地当天算（AGENTS：日期不用 UTC）；runner 是 UTC，北京时间凌晨会被判成“写了明天”（2026-11-19 第一次碰到）
        env:
          TZ: Asia/Shanghai
        run: |
          go build -o bin/sumika-dev ./cmd/sumika-dev
          bin/sumika-dev check docs
        working-directory: ./native

      # Windows runner 的 TEMP 是 8.3 短名（C:\Users\RUNNER~1\…），系统按句柄取回的却是长名：检查点、项目说明这些
      # “路径必须就是它自己”的检查会把整片测试判成走了链接（第一次 CI，2026-11-18）。临时目录换成 runner 自带的长路径；
      # 产品代码遇到短名会拒绝（往安全那边错），挂在待办里单独修。
      - name: 临时目录用长路径
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'gotmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          $t = (Get-Item $t).FullName
          "TEMP=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # 测试要用、仓库里没有的东西，这里装齐（GitHub 官方的做法：镜像没有的软件在 job 里加一步装，见 docs.github.com
      # “Customizing GitHub-hosted runners”）。缺了的话那些测试只会跳过，CI 就悄悄少测（2026-11-19 对照实验：推特卡片真字体 14 条、
      # 表情 2 条、视频几条在两格上一直跳过）；下面 go test 那步的汇总会把“缺依赖而跳过”判红，装的这几步坏了能看见。
      # - rg、fd：上面“安装 Bun 依赖”的 postinstall（scripts/fetch-tools.ts）按钉死的版本和官方摘要装进 vendor/bin，两个系统同一版，
      #   CI 上装不上就让 bun install 红。不再用 apt 的 ripgrep、fd-find（版本跟着发行版走，和开发机不一样）。
      # - ffmpeg、ffprobe：视频取数、短片准备的测试要真的编码解码。Linux 用 Ubuntu 仓库的（版本跟着 24.04），
      #   Windows 用 Chocolatey 钉 9.0.2（和开发机 `ffmpeg -version` 一样）。
      # - 中文字体（只 Linux）：Linux runner 没有中文字体，uitest.RequireGlyphs 画不出字，对比度、行高这类像素用例量不到；
      #   Noto 的字高、行距和文渊圆体不同，度量敏感的断言可能因此露出新的红，那是要追的真实结果。Windows 有微软雅黑。
      - name: 装 ffmpeg 和中文字体（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 装 ffmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install ffmpeg --version=9.0.2 -y --no-progress

      # 文渊圆体、Twemoji：不进 git（46 MB、四千多个文件），scripts/ci-assets.ts 按钉死的版本和摘要从上游官方发布取，
      # 缓存的键是那个脚本的哈希（钉的版本和摘要都写在里面），改了版本就重新下载；缓存命中时脚本核一遍摘要就跳过
      - uses: actions/cache@v6
        with:
          path: |
            native/fonts/WenYuanRoundedSCVF.ttf
            native/twemoji
          key: test-assets-${{ hashFiles('scripts/ci-assets.ts') }}

      - name: 取测试素材（文渊圆体、Twemoji）
        run: bun scripts/ci-assets.ts

      - name: go vet
        working-directory: native
        run: go vet ./...

      # -short：慢的对拍、压力、规模测试跳过（ADR-225），和本机合并队列同一个口径。
      # -timeout 12m：Windows 上最慢的根包约 7 分钟（2026-11-18 第一次 CI）。Linux 上曾有包卡住、整步拖过 40 分钟，
      # 取消后 GitHub 不留这一步的日志；超时让卡住的包自己 panic、打出各协程停在哪，才查得到是哪条测试。
      # 这一步和下面的脚本测试前一步红了也照跑（只有整次被取消才不跑）：默认“前一步失败、后面全跳过”会把后面那步的红盖住，
      # Linux 一格 go test 常红，脚本测试那 16 条在 Linux 上就一直没跑到、也就一直没人看见（2026-11-19）。job 结论照旧：任一步红就红
      # -json 存一份原始结果，再交 scripts/ci-test-report.ts 打成人看的：每个包的结论、红了的用例原文（折叠分组）、按原因汇总的跳过，
      # 缺依赖而跳过的判红。不带 -v 时 go test 不打跳过，CI 上少测了什么原来看不见。这一步红有两种：go test 自己红（退出码照旧），
      # 或者汇总查出缺依赖；两种都在日志里写明。原始结果在 job 的附件里（下一步上传），要细查时下载。
      - name: go test -short（全部包）
        if: ${{ !cancelled() }}
        working-directory: native
        # 用 pwsh 不用 bash：nightly.yml 第一次试跑用 Git Bash 跑 go test，四条“拒绝读取 / 独占打开”的用例红，换 pwsh 后绿（2026-11-19）。
        # Start-Process 把输出直接写文件，是 go 原样写的 UTF-8，不经 pwsh 解码（和 nightly.yml 同一种写法）；两个系统都这样跑
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'go-test.json'; $err = Join-Path $env:RUNNER_TEMP 'go-test-stderr.txt'
          $p = Start-Process -FilePath go -ArgumentList @('test', '-short', '-count=1', '-timeout', '12m', '-json', './...') -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $p.Handle # 先拿住句柄，不然进程结束后 ExitCode 可能读不到（.NET 的已知坑）
          $p.WaitForExit()
          $code = $p.ExitCode
          Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 20
          bun ../scripts/ci-test-report.ts $out
          if ($LASTEXITCODE -ne 0) { $code = 1 }
          "go test 退出码 $($p.ExitCode)，汇总退出码 $LASTEXITCODE"
          exit $code

      - name: 上传 go test 的原始结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-${{ matrix.os }}
          path: ${{ runner.temp }}/go-test.json
          retention-days: 14

      # 点名跑 scripts/ 下的检查脚本测试，名单不在工作流里抄一份：直接用 scripts/server-verify.ts 的 SCRIPT_TESTS
      # （go-verify、合并队列挑 scripts 测试的同一份来源）。冻结的 server/ 测试不在这里。
      # shell 固定 bash：Windows runner 上是 Git Bash，单引号里的多行 JS 不会被拆开。
      - name: 检查脚本的 bun 测试
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bun -e '
            const { SCRIPT_TESTS } = await import("./scripts/server-verify.ts")
            const p = Bun.spawnSync([process.execPath, "test", ...SCRIPT_TESTS], { stdout: "inherit", stderr: "inherit" })
            process.exit(p.exitCode ?? 1)
          '
