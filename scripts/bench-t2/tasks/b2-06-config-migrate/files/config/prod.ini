; 生产环境配置

[server]
host = 0.0.0.0
port = 8443
workers = 8
; 工作进程数
service_id = "0042"
allowed_hosts = www.example.com
legacy_mode = 1

[db]
host = db.example.com
port = 5432
name = "inventory"
user = app
pool_size = 20
legacy_charset = latin1

[log]
level = warn
file = logs/prod.log

[feature]
enabled = search, export, billing
beta_ui = false
rate_limit = 100
