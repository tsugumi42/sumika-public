; 开发环境配置（编造的示例）

[server]
host = 127.0.0.1
port = 8080
workers = 2
; 工作进程数
service_id = "0042"
allowed_hosts = localhost, dev.example.com
legacy_mode = 1

[db]
host = localhost
port = 5432
name = "inventory_dev"
user = app_dev
pool_size = 5
legacy_charset = latin1

[log]
level = debug
file = logs/dev.log

[feature]
enabled = search, export
beta_ui = true
rate_limit = 0
