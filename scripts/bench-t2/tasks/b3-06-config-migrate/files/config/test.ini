# 测试环境配置，和开发环境大体一样

[server]
host = 127.0.0.1
port = 8081
workers = 2
; 工作进程数
service_id = "0042"
allowed_hosts = test.example.com
legacy_mode = 1

[db]
host = db-test.example.com
port = 5432
name = "inventory_test"
user = app_test
pool_size = 5
legacy_charset = latin1

[log]
level = info
file = logs/test.log

[feature]
enabled = search, export
beta_ui = true
rate_limit = 100
