<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画师确认</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6b6b70; --card: #ffffff; --line: #e2e0da;
  --accent: #2f6fdb; --tag: #ecebe6; --warn: #b45309; --ok: #1a7f4b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --fg: #ececef; --muted: #9b9ba3; --card: #1f1f22; --line: #33333a;
    --accent: #7aa7ff; --tag: #2a2a30; --warn: #f0a050; --ok: #5cc98d;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --fg: #ececef; --muted: #9b9ba3; --card: #1f1f22; --line: #33333a;
  --accent: #7aa7ff; --tag: #2a2a30; --warn: #f0a050; --ok: #5cc98d;
}
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; z-index: 2; }
header h1 { font-size: 16px; margin: 0 0 6px 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.stat { color: var(--muted); }
.help { color: var(--muted); font-size: 13px; margin-top: 4px; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; }
select, input[type=search] { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
input[type=search] { min-width: 200px; }
main { padding: 12px 16px 40px; display: grid; gap: 8px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; content-visibility: auto; contain-intrinsic-size: auto 96px; }
.row.on { border-color: var(--ok); }
.who .name { font-weight: 600; }
.who .handle { color: var(--muted); margin-left: 6px; font-size: 13px; }
.who .fol { color: var(--muted); margin-left: 6px; font-size: 12px; }
.bio { color: var(--muted); margin-top: 2px; word-break: break-word; }
.hits { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { background: var(--tag); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
.sugg { font-size: 12px; margin-top: 4px; color: var(--muted); }
.sugg b { color: var(--warn); font-weight: 600; }
.sugg .changed { color: var(--accent); margin-left: 6px; }
.pick { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.pick input { width: 18px; height: 18px; }
#more { margin: 4px auto; }
#msg { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>画师确认</h1>
  <div class="stat" id="stat"></div>
  <div class="help">打开时“画师”类已经默认勾上：只要取消判断错的人，再看一眼“可能是”里有没有漏掉的。勾选自动记在这个浏览器里，不会上传。</div>
  <div class="bar">
    <select id="cat" title="按建议分类筛选">
      <option value="all">全部</option>
      <option value="画师">建议：画师</option>
      <option value="可能是">建议：可能是</option>
      <option value="不是">建议：不是</option>
      <option value="picked">已勾选</option>
      <option value="unpicked">未勾选</option>
      <option value="changed">我改过的</option>
    </select>
    <select id="sort" title="排序">
      <option value="score-desc">分数从高到低</option>
      <option value="score-asc">分数从低到高</option>
      <option value="fol-desc">粉丝数从多到少</option>
      <option value="name-asc">名字</option>
    </select>
    <input type="search" id="q" placeholder="搜索名字、账号、简介">
    <button id="allOn">勾选当前筛选的全部</button>
    <button id="allOff">取消当前筛选的全部</button>
    <button id="reset" title="回到打开时的默认勾选">恢复默认勾选</button>
    <button id="import">导入以前导出的 JSON</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <button id="export" class="primary">导出确认结果 JSON</button>
    <span id="msg"></span>
  </div>
</header>
<main id="list"></main>
<div style="text-align:center"><button id="more" hidden></button></div>
<script>
const DATA = /*DATA*/[];
const KEY = "x-following-review-v2";
const PAGE = 200;
let overrides = {}; // id -> true/false：只存和默认不一样的
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (saved && typeof saved === "object" && !Array.isArray(saved)) overrides = saved;
} catch (e) { /* 存储不可用时只在本页内记录 */ }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(overrides)); } catch (e) { /* 忽略 */ }
}
const byId = new Map(DATA.map((u) => [u.id, u]));
function defaultPick(u) { return u.suggested === "画师"; }
function picked(u) { return Object.prototype.hasOwnProperty.call(overrides, u.id) ? overrides[u.id] : defaultPick(u); }
function setPick(u, on) {
  if (on === defaultPick(u)) delete overrides[u.id]; else overrides[u.id] = on;
}
function changed(u) { return Object.prototype.hasOwnProperty.call(overrides, u.id); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function summary(s) {
  const t = String(s || "").replace(/\s+/g, " ").trim();
  return t.length > 160 ? t.slice(0, 160) + "…" : t;
}
function fmtNum(n) {
  n = Number(n);
  if (!isFinite(n)) return "";
  return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);
}

const list = document.getElementById("list");
const more = document.getElementById("more");
let view = [];
let shown = 0;

function rowHTML(u) {
  const on = picked(u);
  const hits = u.hits.length
    ? u.hits.map((h) => '<span class="tag">' + esc(h.name) + (h.weight ? " +" + h.weight : "") + "</span>").join("")
    : '<span class="tag">无线索</span>';
  return '<div class="row' + (on ? " on" : "") + '" data-id="' + esc(u.id) + '">' +
    '<div><div class="who"><span class="name">' + esc(u.name) + '</span><span class="handle">@' + esc(u.screen_name) + '</span>' +
    '<span class="fol">粉丝 ' + esc(fmtNum(u.followers)) + '</span></div>' +
    '<div class="bio">' + esc(summary(u.bio)) + '</div>' +
    '<div class="hits">' + hits + '</div>' +
    '<div class="sugg">建议：<b>' + esc(u.suggested) + '</b>（分数 ' + u.score + '）' + (changed(u) ? '<span class="changed">已改</span>' : "") + '</div></div>' +
    '<label class="pick"><input type="checkbox"' + (on ? " checked" : "") + '> 是画师</label></div>';
}

function compute() {
  const cat = document.getElementById("cat").value;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  view = DATA.filter((u) => {
    if (cat === "picked" && !picked(u)) return false;
    if (cat === "unpicked" && picked(u)) return false;
    if (cat === "changed" && !changed(u)) return false;
    if (["画师", "可能是", "不是"].includes(cat) && u.suggested !== cat) return false;
    return !q || u.search.includes(q);
  });
  const cmp = {
    "score-desc": (a, b) => b.score - a.score || b.followers - a.followers,
    "score-asc": (a, b) => a.score - b.score || b.followers - a.followers,
    "fol-desc": (a, b) => b.followers - a.followers,
    "name-asc": (a, b) => String(a.name).localeCompare(String(b.name), "ja"),
  }[sort];
  view.sort(cmp);
}
function render() {
  compute();
  shown = Math.min(PAGE, view.length);
  list.innerHTML = view.slice(0, shown).map(rowHTML).join("");
  updateMore();
  updateStat();
}
function updateMore() {
  more.hidden = shown >= view.length;
  more.textContent = "再显示 " + Math.min(PAGE, view.length - shown) + " 个（还有 " + (view.length - shown) + " 个没显示）";
}
more.addEventListener("click", () => {
  const next = Math.min(shown + PAGE, view.length);
  list.insertAdjacentHTML("beforeend", view.slice(shown, next).map(rowHTML).join(""));
  shown = next;
  updateMore();
});
function updateStat() {
  const c = { 画师: 0, 可能是: 0, 不是: 0 }, on = { 画师: 0, 可能是: 0, 不是: 0 };
  let total = 0;
  DATA.forEach((u) => { c[u.suggested]++; if (picked(u)) { on[u.suggested]++; total++; } });
  document.getElementById("stat").textContent =
    "共 " + DATA.length + " 人｜建议 画师 " + c["画师"] + " / 可能是 " + c["可能是"] + " / 不是 " + c["不是"] +
    "｜已勾选 " + total + "（画师 " + on["画师"] + "、可能是 " + on["可能是"] + "、不是 " + on["不是"] + "）｜我改过 " + Object.keys(overrides).length + "｜当前筛选 " + view.length;
}

list.addEventListener("change", (e) => {
  const cb = e.target;
  if (!(cb instanceof HTMLInputElement) || cb.type !== "checkbox") return;
  const row = cb.closest(".row");
  const u = row && byId.get(row.dataset.id);
  if (!u) return;
  setPick(u, cb.checked);
  save();
  row.classList.toggle("on", cb.checked);
  const sugg = row.querySelector(".sugg");
  const mark = sugg.querySelector(".changed");
  if (changed(u) && !mark) sugg.insertAdjacentHTML("beforeend", '<span class="changed">已改</span>');
  if (!changed(u) && mark) mark.remove();
  updateStat();
});
["cat", "sort"].forEach((id) => document.getElementById(id).addEventListener("change", render));
document.getElementById("q").addEventListener("input", render);

function bulk(on) {
  view.forEach((u) => setPick(u, on));
  save();
  render();
  say((on ? "已勾选" : "已取消") + "当前筛选的 " + view.length + " 人");
}
document.getElementById("allOn").addEventListener("click", () => bulk(true));
document.getElementById("allOff").addEventListener("click", () => bulk(false));
document.getElementById("reset").addEventListener("click", () => {
  if (Object.keys(overrides).length && !confirm("把你改过的 " + Object.keys(overrides).length + " 处都恢复成默认勾选？")) return;
  overrides = {};
  save();
  render();
  say("已恢复默认勾选");
});

function say(s) { document.getElementById("msg").textContent = s; }

function exportJSON() {
  const out = {
    version: 2,
    exportedAt: new Date().toISOString(),
    confirmedArtists: DATA.filter(picked).map((u) => ({ id: u.id, screen_name: u.screen_name, name: u.name, suggested: u.suggested, score: u.score })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "artists-confirmed.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  say("已导出 " + out.confirmedArtists.length + " 人");
}
document.getElementById("export").addEventListener("click", exportJSON);

document.getElementById("import").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(String(r.result));
      const ids = new Set((j.confirmedArtists || []).map((x) => String(x.id)));
      if (!Array.isArray(j.confirmedArtists)) throw new Error("没有 confirmedArtists");
      let hit = 0;
      DATA.forEach((u) => { const on = ids.has(u.id); if (on) hit++; setPick(u, on); });
      save();
      render();
      say("已按文件设置勾选：" + hit + " 人在这份关注列表里" + (ids.size > hit ? "，另有 " + (ids.size - hit) + " 个不在列表里被忽略" : ""));
    } catch (err) {
      say("这个文件读不了：" + err.message);
    }
  };
  r.readAsText(f);
});

render();
</script>
</body>
</html>
