<title>Sumika 总览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：全屏可平移缩放的白板，五个画框（结构 / 一回合 / 记忆 / 阶段 / 原则）平铺在世界坐标里；右侧抽屉看详情、写补充 */
:root {
  --bg: #e9edf1;
  --grid: #cfd6de;
  --paper: #f7f9fb;
  --zone: #eef2f6;
  --ink: #1b2230;
  --muted: #5b6676;
  --line: #c3ccd7;
  --edge: #7d8899;
  --accent: #d48a1f;
  --accent-soft: #f6e2c0;
  --k-ext: #e3e9f3;   --k-ext-b: #9fb1cc;
  --k-plugin: #dcefeb; --k-plugin-b: #7fbdb0;
  --k-data: #e9e3f4;  --k-data-b: #ad9ccf;
  --k-char: #f6e1e6;  --k-char-b: #d79aab;
  --k-step: #f5ead7;  --k-step-b: #d6b27a;
  --k-rule: #e2eedf;  --k-rule-b: #94bd8c;
  --k-open: #eceef1;  --k-open-b: #a9b1bc;
  --ok: #2f8a4f; --draft: #b9771a; --todo: #6c7685; --doing: #2d6fb3;
  --n-yellow: #fbe9a7; --n-pink: #f9d3dc; --n-mint: #cdeedd; --n-sky: #cfe3f7;
  --panel: #ffffff;
  --shadow: 0 1px 2px rgba(27,34,48,.08), 0 6px 18px rgba(27,34,48,.08);
  --f-ui: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-mark: "Fredoka", var(--f-ui);
  --f-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171d; --grid: #262d37; --paper: #1a1f27; --zone: #1f252e;
  --ink: #e6eaf0; --muted: #9aa5b4; --line: #364050; --edge: #8794a6;
  --accent: #f0a63c; --accent-soft: #4a3718;
  --k-ext: #232c3a; --k-ext-b: #5b7092; --k-plugin: #1d3330; --k-plugin-b: #4f9184;
  --k-data: #2a2438; --k-data-b: #7f6ca6; --k-char: #3a242b; --k-char-b: #a66b7c;
  --k-step: #352b1c; --k-step-b: #a5844f; --k-rule: #22311f; --k-rule-b: #6a9562;
  --k-open: #262b32; --k-open-b: #6d7684;
  --ok: #5cc27f; --draft: #e3a24a; --todo: #98a2b0; --doing: #6aa8ea;
  --n-yellow: #4d4320; --n-pink: #4b2a33; --n-mint: #213f31; --n-sky: #213448;
  --panel: #1c2129; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #13171d; --grid: #262d37; --paper: #1a1f27; --zone: #1f252e;
  --ink: #e6eaf0; --muted: #9aa5b4; --line: #364050; --edge: #8794a6;
  --accent: #f0a63c; --accent-soft: #4a3718;
  --k-ext: #232c3a; --k-ext-b: #5b7092; --k-plugin: #1d3330; --k-plugin-b: #4f9184;
  --k-data: #2a2438; --k-data-b: #7f6ca6; --k-char: #3a242b; --k-char-b: #a66b7c;
  --k-step: #352b1c; --k-step-b: #a5844f; --k-rule: #22311f; --k-rule-b: #6a9562;
  --k-open: #262b32; --k-open-b: #6d7684;
  --ok: #5cc27f; --draft: #e3a24a; --todo: #98a2b0; --doing: #6aa8ea;
  --n-yellow: #4d4320; --n-pink: #4b2a33; --n-mint: #213f31; --n-sky: #213448;
  --panel: #1c2129; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); overflow: hidden; }
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1.1px, transparent 1.2px); }
#stage.tool-select { cursor: default; } #stage.panning { cursor: grabbing; }
#stage.tool-note, #stage.tool-text { cursor: copy; } #stage.tool-arrow, #stage.tool-pen { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#links .edge { stroke: var(--edge); stroke-width: 1.6; fill: none; }
#links .edge.dash { stroke-dasharray: 6 5; }
#links .elabel { font: 500 12px var(--f-ui); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
#links .uarrow { stroke: var(--accent); stroke-width: 2.2; fill: none; }
#links .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
#links .hit { stroke: transparent; stroke-width: 16; fill: none; pointer-events: stroke; cursor: pointer; }
#links .sel { filter: drop-shadow(0 0 3px var(--accent)); }

.frame { position: absolute; border: 1.5px dashed var(--line); border-radius: 18px; background: color-mix(in srgb, var(--paper) 70%, transparent); }
.frame > .ftitle { position: absolute; left: 22px; top: 14px; font: 600 22px var(--f-ui); letter-spacing: .02em; text-wrap: balance; }
.frame > .ftitle small { font: 500 13px var(--f-ui); color: var(--muted); margin-left: 10px; letter-spacing: 0; }
.zone { position: absolute; border-radius: 12px; background: var(--zone); }
.zone > span { position: absolute; left: 14px; top: 10px; font: 600 12px var(--f-ui); color: var(--muted); letter-spacing: .08em; }

.node { position: absolute; box-sizing: border-box; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
  border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; overflow: hidden; }
.node:hover { box-shadow: var(--shadow); }
.node.selected { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.node .code { font: 500 11px/1.3 var(--f-code); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .title { font: 600 15px/1.35 var(--f-ui); }
.node .brief { font: 400 12.5px/1.5 var(--f-ui); color: var(--muted); }
.node ul { margin: 2px 0 0; padding-left: 16px; font: 400 12.5px/1.65 var(--f-ui); color: var(--ink); }
.node .chips { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.chip { font: 500 11px/1 var(--f-ui); padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.s-ok { color: var(--ok); } .chip.s-draft { color: var(--draft); } .chip.s-todo { color: var(--todo); border-style: dashed; } .chip.s-doing { color: var(--doing); }
.chip.ph { color: var(--muted); border-color: var(--line); font-family: var(--f-code); }
.node .badge { position: absolute; right: 8px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.k-ext { background: var(--k-ext); border-color: var(--k-ext-b); }
.k-plugin { background: var(--k-plugin); border-color: var(--k-plugin-b); }
.k-data { background: var(--k-data); border-color: var(--k-data-b); }
.k-char { background: var(--k-char); border-color: var(--k-char-b); border-style: dashed; }
.k-step { background: var(--k-step); border-color: var(--k-step-b); }
.k-step.ghost { border-style: dashed; background: transparent; }
.k-rule { background: var(--k-rule); border-color: var(--k-rule-b); }
.k-open { background: var(--k-open); border-color: var(--k-open-b); border-style: dashed; }
.k-phase { background: var(--paper); border-color: var(--line); }
.k-phase.now { border-color: var(--doing); box-shadow: 0 0 0 3px color-mix(in srgb, var(--doing) 25%, transparent); }

.item { position: absolute; box-sizing: border-box; }
.item.note { border-radius: 4px 4px 14px 4px; padding: 12px 14px; box-shadow: var(--shadow); font: 400 14px/1.6 var(--f-ui); color: var(--ink); cursor: grab; }
.item.text { padding: 4px 6px; font: 500 16px/1.5 var(--f-ui); color: var(--ink); cursor: grab; min-width: 40px; }
.item .body { white-space: pre-wrap; word-break: break-word; outline: none; min-height: 1.5em; }
.item .body:empty::before { content: attr(data-ph); color: var(--muted); }
.item.selected { outline: 2.5px solid var(--accent); outline-offset: 3px; }
.item.editing { cursor: text; user-select: text; -webkit-user-select: text; }
.item .who { position: absolute; right: 8px; bottom: 5px; font: 500 10px var(--f-ui); color: var(--muted); opacity: .8; }
.c-yellow { background: var(--n-yellow); } .c-pink { background: var(--n-pink); } .c-mint { background: var(--n-mint); } .c-sky { background: var(--n-sky); }

/* 顶栏 */
.bar { position: fixed; z-index: 5; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
#topbar { left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; justify-content: space-between; flex-wrap: wrap; background: transparent; border: 0; box-shadow: none; padding: 0; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px 6px 8px; box-shadow: var(--shadow); }
.brand .mark { font: 600 20px var(--f-mark); letter-spacing: .01em; }
.brand .mark i { font-style: normal; color: var(--accent); }
.brand .sub { font: 400 12px var(--f-ui); color: var(--muted); }
.frames { display: flex; gap: 4px; flex-wrap: wrap; }
.right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: 500 13px var(--f-ui); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { background: var(--zone); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.on { background: var(--accent-soft); border-color: var(--accent); }
.save { font: 500 12px var(--f-ui); color: var(--muted); padding: 0 6px; white-space: nowrap; }
.save .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--todo); vertical-align: 1px; }
.save.ok .dot { background: var(--ok); } .save.busy .dot { background: var(--draft); } .save.err .dot { background: #d0453a; }
#zoomv { font: 500 12px var(--f-code); min-width: 44px; text-align: center; color: var(--muted); }

#tools { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#tools button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; padding: 6px 8px; }
#tools button kbd { font: 400 10px var(--f-code); color: var(--muted); }
#tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); padding: 0; min-width: 0 !important; }
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* 抽屉 */
#panel { position: fixed; z-index: 6; right: 16px; top: calc(72px + env(safe-area-inset-top, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
#panel header { display: flex; align-items: flex-start; gap: 8px; padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
#panel header .h { flex: 1; min-width: 0; }
#panel header .h .code { font: 500 12px var(--f-code); color: var(--muted); }
#panel header h2 { margin: 2px 0 6px; font: 600 19px/1.35 var(--f-ui); text-wrap: balance; }
#panel .scroll { overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
#panel p { margin: 0; font: 400 14px/1.75 var(--f-ui); max-width: 62ch; }
#panel ul { margin: 0; padding-left: 18px; font: 400 13.5px/1.75 var(--f-ui); }
#panel .lbl { font: 600 12px var(--f-ui); color: var(--muted); letter-spacing: .06em; }
#panel textarea { width: 100%; box-sizing: border-box; min-height: 140px; resize: vertical; font: 400 14px/1.7 var(--f-ui); color: var(--ink); background: var(--zone); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
#panel textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
#panel .hint { font: 400 12px/1.6 var(--f-ui); color: var(--muted); }
#panel .refs { display: flex; gap: 6px; flex-wrap: wrap; }
.list-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .t { flex: 1; min-width: 0; font: 400 13.5px/1.6 var(--f-ui); white-space: pre-wrap; word-break: break-word; }
.list-row .t b { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
.danger { color: #c0392b; }
.help { position: fixed; z-index: 4; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font: 400 12px/1.6 var(--f-ui); color: var(--muted); max-width: 260px; }
@media (max-width: 760px) {
  .brand .sub, .help, #tools kbd { display: none; }
  #tools { left: 16px; right: 16px; transform: none; justify-content: center; flex-wrap: wrap; }
  #tools button { min-width: 0; }
  #panel { left: 16px; right: 16px; width: auto; top: auto; height: 58vh; }
}
@media (prefers-reduced-motion: no-preference) { #world.anim { transition: transform .35s cubic-bezier(.2,.7,.2,1); } }
</style>

<div id="stage" class="tool-select" aria-label="Sumika 总览白板">
  <div id="world">
    <div id="layer-frames"></div>
    <svg id="links" aria-hidden="true">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--edge)"/></marker>
        <marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
      </defs>
      <g id="g-base"></g><g id="g-user"></g><g id="g-temp"></g>
    </svg>
    <div id="layer-nodes"></div>
    <div id="layer-items"></div>
  </div>
</div>

<div id="topbar" class="bar">
  <div class="brand"><span class="mark">Sumika<i>.</i></span><span class="sub">栖処 · 整体认知白板 · 2026-10-12</span></div>
  <div class="bar frames" id="frames" role="navigation" aria-label="跳到画框"></div>
  <div class="bar right">
    <span class="save" id="save"><span class="dot"></span><span id="savet">连接存储中…</span></span>
    <button id="btn-list" title="查看所有补充">补充一览</button>
    <button id="zo" aria-label="缩小">−</button><span id="zoomv">60%</span><button id="zi" aria-label="放大">+</button>
    <button id="fit" title="看全部">全部</button>
  </div>
</div>

<div id="tools" class="bar" role="toolbar" aria-label="工具">
  <button data-tool="select" class="on">选择<kbd>V</kbd></button>
  <button data-tool="note">便签<kbd>N</kbd></button>
  <button data-tool="text">文字<kbd>T</kbd></button>
  <button data-tool="arrow">箭头<kbd>A</kbd></button>
  <button data-tool="pen">画笔<kbd>P</kbd></button>
  <span class="sep"></span>
  <button class="swatch c-yellow on" data-color="yellow" aria-label="黄色"></button>
  <button class="swatch c-pink" data-color="pink" aria-label="粉色"></button>
  <button class="swatch c-mint" data-color="mint" aria-label="薄荷绿"></button>
  <button class="swatch c-sky" data-color="sky" aria-label="天蓝"></button>
</div>

<div class="help">拖空白处平移，Ctrl + 滚轮缩放。点任意方块看详情、写补充；双击便签修改；选中后按 Delete 删除。</div>

<aside id="panel" hidden aria-live="polite">
  <header><div class="h" id="ph"></div><button id="pclose" aria-label="关闭">✕</button></header>
  <div class="scroll" id="pbody"></div>
</aside>

<script>

  if (drag.kind === 'pan') { view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.tapEmpty = false; applyView(); return; }
  if (drag.kind === 'move') {
    const dx = (e.clientX - drag.sx) / view.s, dy = (e.clientY - drag.sy) / view.s;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return; drag.moved = true;
    const x = Math.round(drag.ox + dx), y = Math.round(drag.oy + dy);
    if (NB[drag.id]) S.pos[drag.id] = { x, y }; else { S.items[drag.id].x = x; S.items[drag.id].y = y; }
    renderAll(); return;
  }
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  if (drag.kind === 'pen') { const last = drag.pts[drag.pts.length - 1]; if (Math.hypot(wx - last[0], wy - last[1]) > 2.5 / view.s) drag.pts.push([Math.round(wx), Math.round(wy)]); drawTemp('M' + drag.pts.map(p => p.join(',')).join(' L'), 'stroke'); return; }

function drawTemp(d, cls) { const G = $('#g-temp'); G.innerHTML = ''; const p = svg('path', { d, class: cls }); if (cls === 'stroke') p.style.stroke = 'var(--accent)'; else p.setAttribute('marker-end', 'url(#ahu)'); G.appendChild(p); }

    const a = center(d.from), b = center(to); if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 12) return;

  }
  if (d.kind === 'move' && d.moved) { if (NB[d.id]) saveNode(d.id); else saveItem(d.id); return; }

}
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('dblclick', e => { const id = hitId(e.clientX, e.clientY); const it = id && S.items[id]; if (it && (it.type === 'note' || it.type === 'text')) startEdit(id, false); });
stage.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); } }, { passive: false });
addEventListener('keydown', e => {
  const a = document.activeElement; if (a && (a.isContentEditable || a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;

  const k = e.key.toLowerCase();
  if (k === 'v') setTool('select'); else if (k === 'n') setTool('note'); else if (k === 't') setTool('text'); else if (k === 'a') setTool('arrow'); else if (k === 'p') setTool('pen');
  else if (k === 'escape') { setTool('select'); selected = null; closePanel(); renderAll(); }
  else if ((k === 'delete' || k === 'backspace') && selected && S.items[selected]) { e.preventDefault(); removeItem(selected); }
});
addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
addEventListener('resize', () => applyView());

// ───────────── 启动 ─────────────
renderFrames(); renderAll();
requestAnimationFrame(() => { focusRect(FR.A, false); });
initStore();
})();
