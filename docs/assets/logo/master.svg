<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1254 1254">
<title>Sumika 乌鸫头像</title>
<desc>第 1 轮定稿：B 版的形状（头、两撮、两眼、喙）+ A 版的头部明暗（底色 + 10 个径向渐变 + 贴轮廓的内发光）。1254×1254，含奶油底；纯矢量，没有位图。</desc>
<defs>
<!-- 形状：头 8 结点样条（头在画面外的部分随意，只管画面里那段）；大撮 4 结点；小撮 4 结点（椭圆）；眼各 6 结点；喙 4 结点。
     头顶那一段（298.7,356.56 到 925.97,547）拆成三条曲线，中间一条（585,346.05 到 830,458.2）是头压在大撮上的接触线，
     比两端的原曲线整体低约 1.5 px：参考图里这条线在 x=620～780 上比拟合出来的曲线低 1.2～1.7 px，两端（露在奶油底上的部分）不动。 -->
<path id="head" d="M298.7 356.56C397.49 329.72 494.33 327.39 585.00 346.05C673.93 367.35 756.92 405.84 830.00 458.20C864.31 484.20 896.44 513.91 925.97 547.00C1082.53 722.43 1137.17 997.95 1074.59 1210.19C1012 1422.43 721.03 1620.45 537.94 1711.08C354.84 1801.71 117.89 1720.86 -41.15 1539.89C-200.2 1358.91 -257.63 1095.38 -189.73 859.88C-121.84 624.37 57.52 422.08 298.7 356.56Z"/>
<path id="tuftBig" d="M717.98 279.65C763.63 341.53 776.54 451.47 693.27 441.36C626.56 433.26 624.34 358.52 578.96 350.8C553.63 346.49 512.42 278.92 565.86 239.12C598.76 214.61 671.55 216.73 717.98 279.65Z"/>
<path id="tuftSmall" d="M769.03 473.9C739.34 467.65 720.96 435.54 727.98 402.17C735 368.8 764.76 346.81 794.45 353.05C824.14 359.3 842.52 391.41 835.5 424.78C828.48 458.15 798.72 480.14 769.03 473.9Z"/>
<path id="eyeL" d="M380.35 616.57C359.18 606.16 323.32 610.46 305.59 648.58C287.86 686.7 260.49 759.45 254.68 774.59C248.88 789.74 246.84 826.76 282.91 839.78C318.98 852.79 343.83 823.69 350.98 807.03C358.13 790.38 392.12 700.9 400.62 676.11C409.11 651.33 401.51 626.99 380.35 616.57Z"/>
<path id="eyeR" d="M796.9 753.22C774.77 744.09 745.92 754.23 732.62 782.33C719.31 810.44 689.59 890.42 680.69 917.34C671.79 944.26 683.62 969.06 707.81 977.45C731.99 985.83 760.13 975.75 773.72 946.33C787.31 916.91 815.58 833.69 821.98 811.6C828.39 789.51 819.02 762.35 796.9 753.22Z"/>
<path id="beak" d="M590.89 933.06C587.74 959.44 508.14 991.09 469.3 979.48C430.45 967.87 393.21 909.84 394.13 883.05C395.04 856.27 459.59 826.6 511.98 840.24C564.38 853.89 594.03 906.68 590.89 933.06Z"/>
<!-- 小撮、大撮的明暗：第 0 个是不透明底色，后面的是半透明的明暗层 -->
<radialGradient id="gTuftSmall0" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(151.9045 87.0378 -197.6444 344.943 618.71 710)"><stop offset="0.8329" stop-color="#2b3652"/><stop offset="0.8663" stop-color="#2f3a58"/><stop offset="0.8997" stop-color="#323e5d"/><stop offset="0.9332" stop-color="#354364"/><stop offset="0.9666" stop-color="#3a486d"/><stop offset="1" stop-color="#576793"/></radialGradient>
<radialGradient id="gTuftBig0" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(493.4458 -850.9647 300.6606 174.343 195.98 1098.24)"><stop offset="0.8731" stop-color="#252d45"/><stop offset="0.8943" stop-color="#2e3854"/><stop offset="0.9154" stop-color="#313d5b"/><stop offset="0.9366" stop-color="#344161"/><stop offset="0.9577" stop-color="#374567"/><stop offset="0.9789" stop-color="#3c4b70"/><stop offset="1" stop-color="#61719d"/></radialGradient>
<radialGradient id="gTuftBig1" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(124.8052 48.228 -30.9948 80.209 669.53 320)"><stop offset="0.0782" stop-color="#000000" stop-opacity="0"/><stop offset="0.2626" stop-color="#000000" stop-opacity="0"/><stop offset="0.4469" stop-color="#000000" stop-opacity="0"/><stop offset="0.6313" stop-color="#000000" stop-opacity="0"/><stop offset="0.8156" stop-color="#000000" stop-opacity="0.0771"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
<radialGradient id="gTuftBig2" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(251.7378 -69.3318 34.9139 126.7693 613.12 300.94)"><stop offset="0.0458" stop-color="#95b7ff" stop-opacity="0"/><stop offset="0.2367" stop-color="#95b7ff" stop-opacity="0"/><stop offset="0.4275" stop-color="#95b7ff" stop-opacity="0.0339"/><stop offset="0.6183" stop-color="#95b7ff" stop-opacity="0.0194"/><stop offset="0.8092" stop-color="#95b7ff" stop-opacity="0.0087"/><stop offset="1" stop-color="#95b7ff" stop-opacity="0"/></radialGradient>
<!-- 喙：上下两区各一个渐变，分界线是一条二次曲线 -->
<radialGradient id="gBeakUp" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(126.9932 -246.1715 185.3727 95.6287 468.46 1095.39)"><stop offset="0.6589" stop-color="#fe9f3a"/><stop offset="0.7726" stop-color="#fdab49"/><stop offset="0.8863" stop-color="#feb95e"/><stop offset="1" stop-color="#fcb34f"/></radialGradient>
<radialGradient id="gBeakLow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(39.1237 134.583 -160.4712 46.6495 492.38 995.85)"><stop offset="0.1396" stop-color="#d57a2b"/><stop offset="0.3117" stop-color="#e6842e"/><stop offset="0.4838" stop-color="#f49034"/><stop offset="0.6558" stop-color="#fe9c3c"/><stop offset="0.8279" stop-color="#fda646"/><stop offset="1" stop-color="#fdae49"/></radialGradient>
<clipPath id="cBeakUp"><path d="M380 863.38Q495 935.3 610 939.39L610 700L380 700Z"/></clipPath>
<clipPath id="cBeakLow"><path transform="translate(0 -15)" d="M380 863.38Q495 935.3 610 939.39L610 1100L380 1100Z"/></clipPath>
<!-- 头的明暗：底色 rgb(50,62,91) 上叠 h1～h10 十个全幅径向渐变（半透明的亮 / 暗斑，h10 是喙周围的暗晕），最后一层是贴着头轮廓的内发光（rg1 + rf1），全部用 cHead 裁到头的范围内。 -->
<clipPath id="cHead"><use xlink:href="#head"/></clipPath>
<radialGradient id="h1" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(194.38 1306.86) rotate(7.49) scale(2798.25 431.54)"><stop offset="0" stop-color="rgb(31,39,61)" stop-opacity="1"/><stop offset="0.25" stop-color="rgb(31,39,61)" stop-opacity="0.8"/><stop offset="0.5" stop-color="rgb(31,39,61)" stop-opacity="0.42"/><stop offset="0.75" stop-color="rgb(31,39,61)" stop-opacity="0.12"/><stop offset="1" stop-color="rgb(31,39,61)" stop-opacity="0"/></radialGradient>
<radialGradient id="h2" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(322.72 357.93) rotate(16.62) scale(2800 335.13)"><stop offset="0" stop-color="rgb(81,99,138)" stop-opacity="0.5"/><stop offset="0.25" stop-color="rgb(81,99,138)" stop-opacity="0.4"/><stop offset="0.5" stop-color="rgb(81,99,138)" stop-opacity="0.21"/><stop offset="0.75" stop-color="rgb(81,99,138)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(81,99,138)" stop-opacity="0"/></radialGradient>
<radialGradient id="h3" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(1079.2 1171.12) rotate(135.35) scale(566.58 210.56)"><stop offset="0" stop-color="rgb(15,15,26)" stop-opacity="0.228"/><stop offset="0.25" stop-color="rgb(15,15,26)" stop-opacity="0.183"/><stop offset="0.5" stop-color="rgb(15,15,26)" stop-opacity="0.096"/><stop offset="0.75" stop-color="rgb(15,15,26)" stop-opacity="0.027"/><stop offset="1" stop-color="rgb(15,15,26)" stop-opacity="0"/></radialGradient>
<radialGradient id="h4" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(334.91 205.78) rotate(22.9) scale(2674.09 40.03)"><stop offset="0" stop-color="rgb(43,55,84)" stop-opacity="1"/><stop offset="0.25" stop-color="rgb(43,55,84)" stop-opacity="0.8"/><stop offset="0.5" stop-color="rgb(43,55,84)" stop-opacity="0.42"/><stop offset="0.75" stop-color="rgb(43,55,84)" stop-opacity="0.12"/><stop offset="1" stop-color="rgb(43,55,84)" stop-opacity="0"/></radialGradient>
<radialGradient id="h5" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(203.57 277.33) rotate(105.91) scale(62.53 1047.64)"><stop offset="0" stop-color="rgb(95,119,170)" stop-opacity="0.5"/><stop offset="0.25" stop-color="rgb(95,119,170)" stop-opacity="0.4"/><stop offset="0.5" stop-color="rgb(95,119,170)" stop-opacity="0.21"/><stop offset="0.75" stop-color="rgb(95,119,170)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(95,119,170)" stop-opacity="0"/></radialGradient>
<radialGradient id="h6" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(498.15 808.86) rotate(132.12) scale(451.3 626.34)"><stop offset="0" stop-color="rgb(51,65,96)" stop-opacity="0.721"/><stop offset="0.25" stop-color="rgb(51,65,96)" stop-opacity="0.576"/><stop offset="0.5" stop-color="rgb(51,65,96)" stop-opacity="0.303"/><stop offset="0.75" stop-color="rgb(51,65,96)" stop-opacity="0.086"/><stop offset="1" stop-color="rgb(51,65,96)" stop-opacity="0"/></radialGradient>
<radialGradient id="h7" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(29.29 272.86) rotate(141.56) scale(2799.88 356.23)"><stop offset="0" stop-color="rgb(116,132,170)" stop-opacity="0.5"/><stop offset="0.25" stop-color="rgb(116,132,170)" stop-opacity="0.4"/><stop offset="0.5" stop-color="rgb(116,132,170)" stop-opacity="0.21"/><stop offset="0.75" stop-color="rgb(116,132,170)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(116,132,170)" stop-opacity="0"/></radialGradient>
<radialGradient id="h8" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(-110.68 1222.49) rotate(14.97) scale(298.92 540.21)"><stop offset="0" stop-color="rgb(32,39,59)" stop-opacity="0.741"/><stop offset="0.25" stop-color="rgb(32,39,59)" stop-opacity="0.593"/><stop offset="0.5" stop-color="rgb(32,39,59)" stop-opacity="0.311"/><stop offset="0.75" stop-color="rgb(32,39,59)" stop-opacity="0.089"/><stop offset="1" stop-color="rgb(32,39,59)" stop-opacity="0"/></radialGradient>
<radialGradient id="h9" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(1958.08 88.53) rotate(143.85) scale(1774.02 265.39)"><stop offset="0" stop-color="rgb(79,101,154)" stop-opacity="0.368"/><stop offset="0.25" stop-color="rgb(79,101,154)" stop-opacity="0.295"/><stop offset="0.5" stop-color="rgb(79,101,154)" stop-opacity="0.155"/><stop offset="0.75" stop-color="rgb(79,101,154)" stop-opacity="0.044"/><stop offset="1" stop-color="rgb(79,101,154)" stop-opacity="0"/></radialGradient>
<!-- h10 喙周围的暗晕：中心从 A 版的 (494.13,917.34) 挪到 (484,928)，更贴参考图里喙左下方的暗处；喙下面不再另加模糊阴影（两者叠加会让眼睛类判成翻类）。 -->
<radialGradient id="h10" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(484 928) rotate(108.53) scale(162.46 166.89)"><stop offset="0" stop-color="rgb(9,15,17)" stop-opacity="0.5"/><stop offset="0.25" stop-color="rgb(9,15,17)" stop-opacity="0.4"/><stop offset="0.5" stop-color="rgb(9,15,17)" stop-opacity="0.21"/><stop offset="0.75" stop-color="rgb(9,15,17)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(9,15,17)" stop-opacity="0"/></radialGradient>
<linearGradient id="rg1" gradientUnits="userSpaceOnUse" x1="231.82" y1="133.84" x2="1334.29" y2="770.35"><stop offset="0" stop-color="rgb(176,192,243)" stop-opacity="0.476"/><stop offset="0.143" stop-color="rgb(176,192,243)" stop-opacity="0.972"/><stop offset="0.286" stop-color="rgb(176,192,243)" stop-opacity="0.264"/><stop offset="0.429" stop-color="rgb(176,192,243)" stop-opacity="0.155"/><stop offset="0.571" stop-color="rgb(176,192,243)" stop-opacity="0.233"/><stop offset="0.714" stop-color="rgb(176,192,243)" stop-opacity="0.197"/><stop offset="0.857" stop-color="rgb(176,192,243)" stop-opacity="0.117"/><stop offset="1" stop-color="rgb(176,192,243)" stop-opacity="0.185"/></linearGradient>
<!-- mG：内发光的遮罩。两撮羽毛向外扩 10 px 再模糊，涂成 50% 灰，让头压在撮上的那一段接触线旁边的发光减半（参考图里那里是偏暗的）。 -->
<filter id="fM" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1454" height="1454"><feGaussianBlur stdDeviation="6"/></filter>
<mask id="mG" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1454" height="1454"><rect x="-100" y="-100" width="1454" height="1454" fill="#fff"/><g fill="#808080" stroke="#808080" stroke-width="20" stroke-linejoin="round" filter="url(#fM)"><use xlink:href="#tuftBig"/><use xlink:href="#tuftSmall"/></g></mask>
<filter id="rf1" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1454" height="1454" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect id="bg" width="1254" height="1254" fill="#fdf7ea"/>
<!-- 羽毛：先小撮，再大撮（大撮压在小撮上） -->
<use xlink:href="#tuftSmall" fill="url(#gTuftSmall0)"/>
<use xlink:href="#tuftBig" fill="url(#gTuftBig0)"/>
<use xlink:href="#tuftBig" fill="url(#gTuftBig1)"/>
<use xlink:href="#tuftBig" fill="url(#gTuftBig2)"/>
<!-- 头（压在两撮羽毛上） -->
<g clip-path="url(#cHead)">
<rect x="-100" y="-100" width="1454" height="1454" fill="rgb(50,62,91)"/>
<rect x="-100" y="-100" width="1454" height="1454" fill="url(#h1)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h2)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h3)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h4)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h5)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h6)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h7)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h8)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h9)"/><rect x="-100" y="-100" width="1454" height="1454" fill="url(#h10)"/>
<use xlink:href="#head" fill="none" stroke="url(#rg1)" stroke-width="28" stroke-linejoin="round" filter="url(#rf1)" mask="url(#mG)"/>
</g>
<!-- 眼睛 -->
<g fill="#19191d"><use xlink:href="#eyeL"/><use xlink:href="#eyeR"/></g>
<!-- 喙：下区、上区（上区用 clip 盖住分界线以上） -->
<use xlink:href="#beak" fill="url(#gBeakLow)" clip-path="url(#cBeakLow)"/>
<use xlink:href="#beak" fill="url(#gBeakUp)" clip-path="url(#cBeakUp)"/>
</svg>
