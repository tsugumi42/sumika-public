<title>Sumika 乌鸫托盘图标</title>
<desc>托盘用的小图：整个头放进奶油圆角方块（半径 22%）。头、两撮、眼、喙的路径全部来自定稿 master.svg，只做统一缩放和平移（比例 0.16568，不旋转）；眼放大 1.35 倍、喙放大 1.35 倍，各绕自己的重心；明暗压平成一层很淡的渐变。头在画面外的下半部分按头的轮廓补成圆弧。</desc>
