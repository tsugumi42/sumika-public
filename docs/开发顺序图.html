const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// 图例
document.getElementById('legend').innerHTML = Object.entries(KINDS).map(([k, v]) => `<span><i style="background:var(--${k});border-color:var(--${k}-b)"></i>${v}</span>`).join('') + '<span><i class="run"></i>正在跑（后台）</span><span style="color:var(--muted)">点卡片看细节</span>'

// 网格
const main = document.getElementById('main')
let html = '<div class="grid" id="grid"><div class="colhead"></div>' + COLS.map(([a, b]) => `<div class="colhead">${a}<small>${b}</small></div>`).join('')
LANES.forEach((lane, li) => {
  html += `<div class="lane-name">${esc(lane)}</div>`
  for (let c = 0; c < 5; c++) {
    const cards = DATA.filter((d) => d.lane === li && d.col === c)
    html += `<div class="cell">${cards.map((d) => `<button class="card" id="n-${d.id}" data-id="${d.id}" data-kind="${d.kind}" ${d.run ? 'data-run' : ''}><b>${esc(d.title)}</b>${d.sub ? `<small>${esc(d.sub)}</small>` : ''}</button>`).join('')}</div>`
  }
})
html += '</div><svg class="edges" id="edges"></svg>'
main.innerHTML = html

// 箭头：从被等的卡片右边缘，到等它的卡片左边缘（同一列或往回的依赖画成上下弯）
const svg = document.getElementById('edges')
function drawEdges() {
  const box = main.getBoundingClientRect()
  svg.setAttribute('viewBox', `0 0 ${main.scrollWidth} ${main.scrollHeight}`)
  svg.style.width = main.scrollWidth + 'px'; svg.style.height = main.scrollHeight + 'px'
  let d = ''
  const paths = []
  for (const n of DATA) for (const dep of n.deps ?? []) {
    const a = document.getElementById('n-' + dep), b = document.getElementById('n-' + n.id)
    if (!a || !b) continue
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect()
    const sameCol = rb.left < ra.right + 12   // 同一列里的依赖：从上一张的下沿连到下一张的上沿，不绕到左边去
    const x1 = (sameCol ? ra.left + ra.width / 2 : ra.right) - box.left + main.scrollLeft, y1 = (sameCol ? ra.bottom : ra.top + ra.height / 2) - box.top
    const x2 = (sameCol ? rb.left + rb.width / 2 : rb.left) - box.left + main.scrollLeft, y2 = (sameCol ? rb.top : rb.top + rb.height / 2) - box.top
    const dx = Math.max(24, Math.abs(x2 - x1) / 2)
    const dy = Math.max(12, Math.abs(y2 - y1) / 2)
    const dpath = sameCol ? `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}` : `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`
    paths.push(`<path data-from="${dep}" data-to="${n.id}" d="${dpath}" marker-end="url(#ah)"/>`)
  }
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor" style="stroke:none;opacity:1"/></marker></defs>' + paths.join('')
}
addEventListener('resize', drawEdges)
requestAnimationFrame(() => requestAnimationFrame(drawEdges))
if (document.fonts?.ready) document.fonts.ready.then(drawEdges)

// 点一张：亮出它等的和等它的，旁边面板写细节
const side = document.getElementById('side')
function chain(id, key, seen = new Set()) {   // key: 'deps'（它等谁，往上游）或反过来（谁等它，往下游）
  const out = []
  const next = key === 'deps' ? (byId[id].deps ?? []) : DATA.filter((d) => (d.deps ?? []).includes(id)).map((d) => d.id)
  for (const x of next) if (!seen.has(x)) { seen.add(x); out.push(x, ...chain(x, key, seen)) }
  return out
}
function select(id) {
  main.classList.add('dim')
  const up = chain(id, 'deps'), down = chain(id, 'down')
  document.querySelectorAll('.card').forEach((c) => { c.removeAttribute('data-hl') })
  document.querySelectorAll('#edges path').forEach((p) => p.removeAttribute('data-hl'))
  document.getElementById('n-' + id).setAttribute('data-hl', 'self')
  for (const x of [...up, ...down]) document.getElementById('n-' + x)?.setAttribute('data-hl', 'rel')
  const rel = new Set([id, ...up, ...down])
  document.querySelectorAll('#edges path').forEach((p) => { if (rel.has(p.dataset.from) && rel.has(p.dataset.to)) p.setAttribute('data-hl', '') })
  const n = byId[id]
  const names = (ids) => ids.length ? ids.map((x) => esc(byId[x].title)).join('、') : '没有'
  side.innerHTML = `<button aria-label="关掉" onclick="clearSel()">×</button><h2>${esc(n.title)}</h2><span class="tag" style="background:var(--${n.kind});border-color:var(--${n.kind}-b)">${KINDS[n.kind]}</span><span class="tag">${esc(LANES[n.lane])} · ${esc(COLS[n.col][0])}</span>${n.run ? '<span class="tag">正在跑</span>' : ''}<p>${esc(n.note)}</p><p class="src">它在等：${names(chain(id, 'deps').filter((x) => (n.deps ?? []).includes(x)))}<br>等它的：${names(DATA.filter((d) => (d.deps ?? []).includes(id)).map((d) => d.id))}</p>`
  side.setAttribute('data-open', '')
}
function clearSel() {
  main.classList.remove('dim'); side.removeAttribute('data-open')
  document.querySelectorAll('.card').forEach((c) => c.removeAttribute('data-hl'))
  document.querySelectorAll('#edges path').forEach((p) => p.removeAttribute('data-hl'))
}
main.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) select(c.dataset.id); else clearSel() })
addEventListener('keydown', (e) => { if (e.key === 'Escape') clearSel() })
</script>
</body>
</html>
